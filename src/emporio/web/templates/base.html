<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Empório da Música{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link href="/static/app.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/marca.png">
</head>
<body>
  <nav class="navbar navbar-expand emp-navbar mb-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="/static/marca.png" alt="Empório da Música" class="emp-logo-sm">
        <span class="fw-semibold emp-brand-text d-none d-md-inline">Empório da Música</span>
      </a>
      <div class="navbar-nav me-auto">
        <a class="nav-link {% if ativo == 'atendimento' %}active{% endif %}" href="/">Atendimento</a>
        <a class="nav-link {% if ativo == 'vendedor' %}active{% endif %}" href="/vendedor">Painel do vendedor</a>
      </div>
      <span class="navbar-text small d-none d-sm-inline">ZDR obrigatório</span>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
