<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Empório da Música{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link href="/static/app.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/marca.png">
</head>
<body>
  <nav class="navbar navbar-expand emp-navbar mb-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/atendimento">
        <img src="/static/marca.png" alt="Empório da Música" class="emp-logo-sm">
        <span class="fw-semibold emp-brand-text d-none d-md-inline">Empório da Música</span>
      </a>
      {% if usuario %}
      <div class="navbar-nav me-auto">
        <a class="nav-link {% if ativo == 'atendimento' %}active{% endif %}" href="/atendimento">Atendimento</a>
        <a class="nav-link {% if ativo == 'simulador' %}active{% endif %}" href="/simulador">Simulador de WhatsApp</a>
        <a class="nav-link {% if ativo == 'configuracoes' %}active{% endif %}" href="/configuracoes">Configurações</a>
      </div>
      <span class="navbar-text small me-3 d-none d-md-inline">{% if demo %}modo demonstração · {% endif %}ZDR obrigatório · {{ usuario }}</span>
      <form method="post" action="/sair"><button class="btn btn-sm btn-outline-light">Sair</button></form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Conversas trocadas por HTMX: mantém a rolagem no fim (como no WhatsApp), a não ser que a pessoa
    // tenha subido para ler mensagens antigas e nada novo tenha chegado.
    (() => {
      let noFim = true, topo = 0, total = -1;
      const thread = () => document.getElementById("thread");
      document.body.addEventListener("htmx:beforeSwap", () => {
        const t = thread();
        if (!t) return;
        topo = t.scrollTop;
        noFim = t.scrollHeight - t.scrollTop - t.clientHeight < 40;
      });
      const restaurar = () => {
        const t = thread();
        if (!t) return;
        const n = t.querySelectorAll(".msg").length;
        t.scrollTop = (noFim || n !== total) ? t.scrollHeight : topo;
        total = n;
      };
      document.body.addEventListener("htmx:afterSettle", restaurar);
      restaurar();
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
