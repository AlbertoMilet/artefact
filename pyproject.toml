[project]
name = "emporio-agente"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer, Artefact)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: chama o modelo real via OpenRouter (precisa de OPENROUTER_API_KEY)"]
addopts = "-m 'not llm'"
